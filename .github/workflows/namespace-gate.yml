name: Solslot V2 Gate

on:
  pull_request:
  push:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: python3 scripts/check_namespace.py
      - run: python3 scripts/check_secrets.py
      - run: npm run compile
      - run: npm test
      - run: python3 scripts/check_namespace.py --paths .
      - run: python3 scripts/check_secrets.py --paths .
